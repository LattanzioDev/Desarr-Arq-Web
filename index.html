<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rick and Morty Characters</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Rick and Morty Characters</h1>

    <div class="buttons">
      <button id="get-all">Obtener todos los personajes</button>
    </div>

    <form id="filter-form">
      <h2>Filtrar personajes</h2>
      <input type="text" id="name" placeholder="Nombre" />
      <input type="text" id="status" placeholder="Estado (alive, dead, unknown)" />
      <input type="text" id="species" placeholder="Especie" />
      <input type="text" id="type" placeholder="Tipo" />
      <input type="text" id="gender" placeholder="Género (male, female, genderless, unknown)" />
      <button type="submit">Buscar con filtros</button>
    </form>

    <div id="error" class="error oculto"></div>
    <div id="results" class="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
